name: Alerta Bitcoin

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar notificacao de teste agora?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alerta-btc
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verificar preco
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRECO_ALVO: ${{ vars.PRECO_ALVO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste && '1' || '0' }}
        run: python3 alerta.py

      - name: Salvar estado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "alerta-bot"
            git config user.email "alerta-bot@users.noreply.github.com"
            git add estado.json
            git commit -m "Atualiza estado do alerta"
            git push
          fi
